plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        javaParameters = true
    }
}

repositories {
    mavenCentral()
    maven { name = 'KotlinForForge'; url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    maven { name = 'RyanHCode'; url = 'https://maven.ryanhcode.dev/releases' }
    exclusiveContent {
        forRepository { maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'mezz.jei' }
    }
    exclusiveContent {
        forRepository { maven { name = 'CurseMaven'; url = 'https://www.cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

def aetherDevRuntimeSource = configurations.create('aetherDevRuntimeSource') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

def patchedAetherDevRuntime = layout.buildDirectory.file(
        "dev-runtime/aether-${aether_modrinth_maven_version}-devlaunch.jar"
)

def patchAetherDevRuntime = tasks.register('patchAetherDevRuntime', Exec) {
    group = 'development setup'
    description = 'Creates the project-local Aether copy required by ModDevGradle DevLaunch.'
    inputs.files(aetherDevRuntimeSource)
    inputs.file('scripts/patch_aether_devlaunch.py')
    outputs.file(patchedAetherDevRuntime)
    doFirst {
        commandLine 'python3', 'scripts/patch_aether_devlaunch.py',
                aetherDevRuntimeSource.singleFile.absolutePath,
                patchedAetherDevRuntime.get().asFile.absolutePath
    }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:${kotlin_for_forge_version}"

    // Development-only quality-of-life and diagnostics available to runClient.
    // runtimeOnly keeps all of these out of the published Dynamic Universe artifact.
    runtimeOnly "curse.maven:just-zoom-561885:${just_zoom_curseforge_file_id}"
    // Just Zoom requires Konkrete, but CurseMaven does not expose that relation transitively.
    runtimeOnly "curse.maven:konkrete-410295:${konkrete_curseforge_file_id}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    runtimeOnly "maven.modrinth:1bokaNcj:${xaeros_minimap_modrinth_maven_version}"
    // Full-screen world map for runClient; it is never bundled with the published mod.
    runtimeOnly "maven.modrinth:NcUtCpym:${xaeros_world_map_modrinth_maven_version}"
    // Targeted block/entity inspection; it also integrates with the existing JEI runtime.
    runtimeOnly "maven.modrinth:nvQzSEkH:${jade_modrinth_maven_version}"
    // Client-side ItemStack and looked-at entity SNBT inspection without editing save data.
    runtimeOnly "maven.modrinth:w0xJ0EWR:${nbt_viewer_modrinth_maven_version}"
    // Tick, heap, and CPU profiling through /spark for client and integrated-server analysis.
    runtimeOnly "maven.modrinth:l6YH9Als:${spark_modrinth_maven_version}"
    // Readable F3 HUD for dimension, chunk, entity, and client-runtime state.
    runtimeOnly "maven.modrinth:8shC1gFX:${betterf3_modrinth_maven_version}"

    // Optional Distant Horizons API/runtime target. Common code must remain loadable without it.
    compileOnly "maven.modrinth:uCdwusMi:${distant_horizons_modrinth_maven_version}"
    runtimeOnly "maven.modrinth:uCdwusMi:${distant_horizons_modrinth_maven_version}"

    // Compatibility targets, deliberately optional and never referenced from common code.
    compileOnly "maven.modrinth:zf4Szzx2:${immersive_portals_modrinth_maven_version}"
    runtimeOnly "maven.modrinth:zf4Szzx2:${immersive_portals_modrinth_maven_version}"
    // Required by the selected Immersive Portals runtime artifact.
    runtimeOnly "maven.modrinth:9s6osm5g:${cloth_config_modrinth_maven_version}"

    // Optional dimension-integration targets, loaded automatically by runClient only.
    compileOnly "maven.modrinth:YhmgMVyu:${aether_modrinth_maven_version}"
    add('aetherDevRuntimeSource', "maven.modrinth:YhmgMVyu:${aether_modrinth_maven_version}")
    runtimeOnly files(patchedAetherDevRuntime.map { it.asFile }) {
        builtBy patchAetherDevRuntime
    }
    // Aether embeds Accessories, whose required owo dependency is not exposed by Modrinth Maven.
    runtimeOnly "maven.modrinth:ccKDOlHs:${owo_lib_modrinth_maven_version}"
    compileOnly "maven.modrinth:Ejfl5qDL:${undergarden_modrinth_maven_version}"
    runtimeOnly "maven.modrinth:Ejfl5qDL:${undergarden_modrinth_maven_version}"
    compileOnly "dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:${kotlin_version}"
}

tasks.matching { it.name in ['prepareClientRun', 'writeClientLegacyClasspath', 'runClient'] }.configureEach {
    dependsOn patchAetherDevRuntime
}

tasks.test { useJUnitPlatform() }

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def values = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            kotlin_for_forge_loader_range: kotlin_for_forge_loader_range,
            immersive_portals_version: immersive_portals_version,
            sable_version: sable_version,
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
            mod_license: mod_license, mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties values
    expand values
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
